name: Build apps

on:
  push:
    tags: ["v*"]          # push a tag like v1.0 to build and publish a release
  workflow_dispatch:       # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  name: Windows,         pkg: Ukeplan-Windows.zip }
          - { os: macos-latest,    name: Mac-AppleSilicon, pkg: Ukeplan-Mac-AppleSilicon.zip }
          - { os: macos-15-intel,  name: Mac-Intel,        pkg: Ukeplan-Mac-Intel.zip }
          - { os: ubuntu-22.04,    name: Linux,           pkg: Ukeplan-Linux.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libdbus-1-3

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Set version from the git tag (v1.2 -> 1.2)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION = \"${GITHUB_REF_NAME#v}\"" > _version.py

      - name: Build
        run: pyinstaller --noconfirm --windowed --name Ukeplan ukeplan.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Ukeplan -DestinationPath "${{ matrix.pkg }}"

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/Ukeplan.app
          ditto -c -k --keepParent dist/Ukeplan.app "${{ matrix.pkg }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.pkg }}" -C dist Ukeplan

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.pkg }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pkgs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: pkgs/*
          generate_release_notes: true
